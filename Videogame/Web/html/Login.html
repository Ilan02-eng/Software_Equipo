<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/Login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <img src="../../VisualsVideogame/Web/divider_login.png" alt="divider login" class="login-divider">
    
    <h1>Hello!</h1>

    <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

    <button id="loginBtn">
        LOGIN
    </button>
    
    <p id="message"></p>
    
    <a href="Run_Menu.html" class="back-link">Menu</a>
</div>

<script src="../js/Login.js"></script>
</body>
</html>
