<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Catharsis</title>

    <link rel="stylesheet" href="../css/Register.css">
</head>

<body>

    <div class="register-container">

        <h1>New Account</h1>

        <input type="text"
               id="username"
               placeholder="Username">

        <input type="text"
               id="name"
               placeholder="Name">

        <input type="text"
               id="lastname"
               placeholder="Last Name">

        <input type="number"
               id="gender"
               placeholder="Gender">

        <input type="text"
               id="age"
               placeholder="Age">

        <input type="text"
               id="password"
               placeholder="Password"> 

        <button id="registerBtn">
            REGISTER
        </button>

        <p id="message"></p>

        <a href="Run_Menu.html" class="back-link">
            Menu
        </a>

    </div>

    <script src="../js/Register.js"></script>

</body>
</html>
