<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics | Catharsis</title>

    <link rel="stylesheet" href="../css/Statistics.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="top-bar">
        <a href="About.html" class="top-link">ABOUT</a>
        <a href="Login.html" class="top-link">LOGIN</a>
        <a href="Register.html" class="top-link">REGISTER</a>
    </div>

    <div class="stats-container">

        <img src="../../VisualsVideogame/Web/Logo.png"
             alt="Catharsis Logo"
             class="stats-logo">

        <h1>Player Statistics</h1>

        <div class="stats-grid">

            <div class="stat-card">
                <h2>Runs Completed</h2>
                <p id="runsCompleted">0</p>
            </div>

            <div class="stat-card">
                <h2>Neighbors Helped</h2>
                <p id="neighborsHelped">0</p>
            </div>

            <div class="stat-card">
                <h2>Cards Collected</h2>
                <p id="cardsCollected">0</p>
            </div>

            <div class="stat-card">
                <h2>Highest Level</h2>
                <p id="highestLevel">0</p>
            </div>

            <div class="stat-card">
                <h2>Total Play Time</h2>
                <p id="playTime">0 Hours</p>
            </div>

            <div class="stat-card">
                <h2>Bosses Defeated</h2>
                <p id="bossesDefeated">0</p>
            </div>

        </div>

        <button id="backBtn">
            Back
        </button>

    </div>

    <script src="../js/Statistics.js"></script>

</body>
</html>
